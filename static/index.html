<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>桥梁结构监测与限行决策</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;color:#17212b}pre{background:#f4f7f9;padding:1rem;overflow:auto}button{padding:.55rem 1rem}.fail{background:#fdecea;border:1px solid #d64541;color:#8c1f18;padding:.6rem 1rem;margin:.5rem 0;border-radius:4px}</style></head><body><h1>桥梁结构监测与限行决策</h1><p>融合传感、巡检、交通荷载和天气数据，生成限载限行或恢复建议</p><p>监测偏差与预警阈值之比和多条异常记录决定告警等级；限行与封闭决策必须绑定交通通告记录。</p><button onclick="loadItems()">刷新列表</button><div id="last"></div><pre id="out">使用X-Actor和X-Role请求头调用接口。</pre><script>async function loadItems(){const r=await fetch('/api/items',{headers:{'X-Actor':'demo','X-Role':'viewer'}});const data=await r.json();document.getElementById('out').textContent=JSON.stringify(data,null,2);const box=document.getElementById('last');box.innerHTML='';const failed=(data.items||[]).filter(i=>i.last_decision);for(const i of failed){const d=i.last_decision;const el=document.createElement('div');el.className='fail';el.textContent=`桥梁告警#${i.id}「${i.title}」最近一次决策失败：${d.reason}（通告编号：${d.notice_ref||'-'}，操作人：${d.actor}，时间：${d.at}）`;box.appendChild(el)}}</script></body></html>
