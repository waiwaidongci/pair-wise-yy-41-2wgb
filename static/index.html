<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>桥梁结构监测与限行决策</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;color:#17212b}pre{background:#f4f7f9;padding:1rem;overflow:auto}button{padding:.55rem 1rem}input,select{padding:.4rem;margin:.2rem}label{display:inline-block;margin:.2rem .6rem .2rem 0}h2{font-size:1.1rem;margin-top:1.6rem}</style></head><body><h1>桥梁结构监测与限行决策</h1><p>融合传感、巡检、交通荷载和天气数据，生成限载限行或恢复建议</p><p>监测偏差与预警阈值之比和多条异常记录决定告警等级；限行与封闭决策必须绑定交通通告记录。</p><button onclick="loadAll()">刷新列表</button><pre id="out">使用X-Actor和X-Role请求头调用接口。</pre><h2>状态决策</h2><div><label>告警ID <input id="itemId" type="number" min="1" value="1"></label><label>角色 <select id="role"><option>sensor_operator</option><option selected>bridge_engineer</option><option>traffic_authority</option><option>viewer</option></select></label><label>目标状态 <select id="target"><option>warning</option><option>restricted</option><option>closed</option><option>restored</option></select></label><label>期望版本 <input id="version" type="number" min="1" value="1"></label><label>通告编号 <input id="noticeNo" placeholder="限行/封闭必填"></label><button onclick="decide()">提交决策</button></div><pre id="result">尚未提交决策。</pre><h2>最近一次决策失败</h2><pre id="failure">暂无</pre><script>function headers(){return{'Content-Type':'application/json','X-Actor':'demo','X-Role':document.getElementById('role').value}}
async function loadItems(){const r=await fetch('/api/items',{headers:headers()});document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2)}
async function loadFailure(){const r=await fetch('/api/last-decision-failure',{headers:headers()});const d=await r.json();document.getElementById('failure').textContent=d.failure?JSON.stringify(d.failure,null,2):'暂无'}
async function decide(){const body={target:document.getElementById('target').value,expected_version:Number(document.getElementById('version').value)};const no=document.getElementById('noticeNo').value.trim();if(no){body.notice_no=no}const r=await fetch('/api/items/'+document.getElementById('itemId').value+'/transition',{method:'POST',headers:headers(),body:JSON.stringify(body)});document.getElementById('result').textContent=JSON.stringify(await r.json(),null,2);loadFailure()}
function loadAll(){loadItems();loadFailure()}
loadAll();</script></body></html>
